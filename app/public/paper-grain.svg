<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="2.4" intercept="-0.7"/>
        <feFuncG type="linear" slope="2.4" intercept="-0.7"/>
        <feFuncB type="linear" slope="2.4" intercept="-0.7"/>
        <feFuncA type="linear" slope="0.24"/>
      </feComponentTransfer>
    </filter>
    <filter id="density" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.09"/>
      </feComponentTransfer>
    </filter>
    <filter id="fibres" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.38" numOctaves="2" seed="41" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 1 0 0 0 0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues=".3 .18 0 0 0 0 0 0 .18 .3"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <path filter="url(#density)" d="M0 0h512v512H0z"/>
  <path filter="url(#grain)" d="M0 0h512v512H0z"/>
  <path filter="url(#fibres)" d="M0 0h512v512H0z"/>
</svg>

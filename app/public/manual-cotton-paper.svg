<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <defs>
    <!-- Long, fine fibres and open pulp clouds, distinct from the site's dense grain. -->
    <filter id="pulp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".023 .038" numOctaves="3" seed="62" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".14"/>
      </feComponentTransfer>
    </filter>
    <filter id="fibre" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".16 .7" numOctaves="2" seed="31" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .42 0 0 0 0 .38 0 0 0 0 .3 1 0 0 0 0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues=".5 .22 0 0 0 0 0 .18 .4"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <path filter="url(#pulp)" d="M0 0h384v384H0z"/>
  <path filter="url(#fibre)" d="M0 0h384v384H0z"/>
  <g fill="none" stroke="#8b816b" stroke-width=".65" stroke-linecap="round" opacity=".35">
